<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>다녀온 곳 지도장</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: header + sticky filter bar; below it a list/map tab pair on phones, side-by-side list and map on wide screens */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --fg:#17211d; --muted:#5d6b65; --line:#dbe3df;
  --accent:#0f6b5c; --accent-soft:#dcefe9; --on-accent:#ffffff;
  --cat-r:#d0482b; --cat-c:#8a5a2b; --cat-h:#3f5fc4;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111715; --surface:#1a2320; --fg:#e6eeea; --muted:#9aaaa3; --line:#2b3733;
  --accent:#5cc4ae; --accent-soft:#1f3a33; --on-accent:#0b1412;
  --cat-r:#f07a5c; --cat-c:#d3a271; --cat-h:#8ea6f0; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:24px 12px}
h1{font-family:var(--display);font-weight:400;font-size:2rem;line-height:1.15;margin:0;letter-spacing:.01em;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgb(0 0 0 / .04)}
.bar .wrap{padding-block:12px;display:grid;gap:10px}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 40px 11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:1.3rem;width:32px;height:32px;cursor:pointer;border-radius:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip,.tab{flex:none;font:inherit;font-size:.88rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.chip b{font-weight:500;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"],.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.8}
.chips.small .chip{font-size:.82rem;padding:4px 10px}
#kind .chip{border-style:dashed}
#kind .chip[aria-pressed="true"]{border-style:solid}
.kcat{color:var(--fg);opacity:.75}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:6px;align-items:center}
.tabs .status{margin-left:auto}
.status{color:var(--muted);font-size:.88rem;font-variant-numeric:tabular-nums}
.layout{display:block;padding-block:8px 40px}
#mapPane{height:calc(100dvh - 210px);min-height:360px;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;background:var(--surface)}
#map{position:absolute;inset:0}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:.92rem}
@media (min-width:900px){
  .tabs #tabMap{display:none}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
  #listPane,#mapPane{display:block!important}
  #mapPane{position:sticky;top:150px;height:calc(100vh - 170px)}
}
section.grp{margin-top:16px}
section.grp:first-child{margin-top:4px}
.grp h2{font-size:.95rem;font-weight:700;margin:0 0 6px;display:flex;align-items:baseline;gap:8px}
.grp h2 span{color:var(--muted);font-weight:400;font-size:.85rem;font-variant-numeric:tabular-nums}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li.row{display:flex;align-items:center;border-top:1px solid var(--line)}
li.row:first-child{border-top:0}
.place{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;color:inherit;text-decoration:none;min-height:52px}
@media (hover:hover){.place:hover{background:var(--accent-soft)}}
.place:active{background:var(--accent-soft)}
.place .nm{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.place .dong{flex:none;color:var(--muted);font-size:.85rem}
.acts{flex:none;display:flex;align-self:stretch}
.act{flex:none;border:0;border-left:1px solid var(--line);background:none;color:var(--accent);font:inherit;font-size:.8rem;font-weight:700;padding:0 12px;cursor:pointer;min-height:52px;white-space:nowrap}
.act b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
@media (hover:hover){.act:hover{background:var(--accent-soft)}}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:.8rem;margin-top:2px}
.meta .tag{font-size:inherit}
.dist{font-variant-numeric:tabular-nums}
.nearhead{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:14px;display:grid;gap:10px;margin-top:4px}
.nh-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.nh-title{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-size:.72rem;letter-spacing:.06em;color:var(--accent);font-weight:700}
.nh-title strong{font-size:1.15rem;line-height:1.3;overflow-wrap:anywhere}
.nh-sub{color:var(--muted);font-size:.85rem}
.nh-close{flex:none;font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer}
.nh-note{margin:0;color:var(--muted);font-size:.8rem}
.grp h2 .tag{margin-right:-2px}
.act.add[aria-pressed="true"]{color:var(--on-accent);background:var(--accent)}
.course{display:grid;gap:12px;margin-top:4px}
.chead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.chead h2{margin:0;font-size:1.05rem}
.ctotal{font-size:1.6rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.ctotal small{font-size:.85rem;font-weight:400;color:var(--muted);margin-left:6px}
.cbtns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:.88rem;border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.cnote{margin:0;color:var(--muted);font-size:.82rem}
.cmsg{margin:0;font-size:.88rem;color:var(--accent);font-weight:500}
ol.stops{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stop{display:flex;align-items:center;gap:10px;padding:10px 0 10px 12px;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700;color:#fff;background:var(--dot)}
.stop .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.stop .nm{font-weight:500;overflow-wrap:anywhere}
.stop .acts .act{min-height:44px}
.leg{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:6px 12px 6px 50px;background:var(--bg);border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.leg a{color:var(--accent);font-weight:700;text-decoration:none}
.leg a:hover{text-decoration:underline}
.ovnum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 system-ui,sans-serif;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgb(0 0 0 / .35)}
.tag{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:.75rem;color:var(--muted)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--dot);margin-right:6px;vertical-align:1px}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--on-accent)}
.place .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.place .memo{color:var(--muted);font-size:.82rem}
.k-r{--dot:var(--cat-r)}.k-c{--dot:var(--cat-c)}.k-h{--dot:var(--cat-h)}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:.82rem;padding-block:16px 32px;border-top:1px solid var(--line)}
.iw{padding:10px 12px;min-width:160px;max-width:240px;font-family:var(--body);font-size:14px;line-height:1.4;color:#17211d}
.iw strong{display:block;margin-bottom:2px}
.iw span{color:#5d6b65;font-size:12px}
.iw a{display:inline-block;margin-top:6px;color:#0f6b5c;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap"><header class="top">
  <h1>다녀온 곳 지도장</h1>
  <p class="sub">카카오맵에 저장해 둔 식당과 카페 <span id="total"></span>곳. 종류와 지역을 고르거나 이름으로 찾아보세요.</p>
</header></div>

<div class="bar"><div class="wrap">
  <div class="search">
    <input id="q" type="search" placeholder="장소 이름, 동네로 찾기" autocomplete="off" aria-label="장소 이름이나 동네로 찾기">
    <button class="clear" id="clear" type="button" aria-label="검색어 지우기" hidden>×</button>
  </div>
  <div class="chips" id="cat" role="group" aria-label="종류"></div>
  <div class="chips" id="sido" role="group" aria-label="시도"></div>
  <div class="chips small" id="sgg" role="group" aria-label="시군구" hidden></div>
  <div class="chips small" id="kind" role="group" aria-label="주메뉴"></div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tabList" role="tab" aria-selected="true" type="button">목록</button>
    <button class="tab" id="tabMap" role="tab" aria-selected="false" type="button">지도</button>
    <button class="tab" id="tabCourse" role="tab" aria-selected="false" type="button">코스 <span id="courseN"></span></button>
    <span class="status" id="status" aria-live="polite"></span>
  </div>
</div></div>

<main class="wrap layout">
  <div id="listPane"><div id="out"></div></div>
  <div id="mapPane" hidden><div id="map"></div><div class="mapmsg" id="mapmsg">지도를 불러오는 중이에요.</div></div>
</main>
<div class="wrap"><footer>출처: 카카오맵 저장 장소(이름 없이 주소만 저장한 곳은 제외). 음식 분류는 카카오맵 분류(2026년 11월 기준)이고, 주메뉴 묶음(닭고기, 해산물·회 등)은 그 분류를 모아 만든 것입니다. 카카오에서 찾지 못한 곳은 비워 두었습니다. 이름을 누르면 카카오맵 장소 페이지가 열립니다(링크가 없는 곳은 카카오맵 검색).</footer></div>

const MAIN_ORDER=MAIN.map(m=>m[0]).concat([OTHER,NOT_FOOD,NO_KIND]);

/* straight-line distance in meters */
function meters(a,b){const R=6371000,toR=Math.PI/180,dLa=(b.lat-a.lat)*toR,dLn=(b.lng-a.lng)*toR;const h=Math.sin(dLa/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const located=places.filter(p=>p.lat);
function nearList(c,r){return located.filter(p=>p!==c&&Math.abs(p.lat-c.lat)<r/90000&&meters(c,p)<=r).map(p=>[p,meters(c,p)]).sort((a,b)=>a[1]-b[1]);}
const nearCount={};
(function(){const R=500;for(const a of located){let n=0;for(const b of located){if(a!==b&&Math.abs(a.lat-b.lat)<R/90000&&Math.abs(a.lng-b.lng)<R/70000&&meters(a,b)<=R)n++;}nearCount[a.i]=n;}})();

function courseLen(order){let s=0;for(let j=1;j<order.length;j++)s+=meters(places[order[j-1]],places[order[j]]);return s;}
/* shortest open path from the first stop through all others (Held-Karp, exact for up to 12 stops) */
function bestOrder(order){
  const n=order.length;if(n<3)return order.slice();
  const P=order.map(i=>places[i]),m=n-1,FULL=(1<<m)-1;
  const D=P.map(a=>P.map(b=>meters(a,b)));
  const dp=new Float64Array((1<<m)*m).fill(Infinity),par=new Int8Array((1<<m)*m).fill(-1);
  for(let j=0;j<m;j++)dp[(1<<j)*m+j]=D[0][j+1];
  for(let S=1;S<=FULL;S++)for(let j=0;j<m;j++){
    if(!(S&(1<<j)))continue;const v=dp[S*m+j];if(v===Infinity)continue;
    for(let k=0;k<m;k++){if(S&(1<<k))continue;const T=S|(1<<k),nv=v+D[j+1][k+1];if(nv<dp[T*m+k]){dp[T*m+k]=nv;par[T*m+k]=j;}}
  }
  let end=0;for(let j=1;j<m;j++)if(dp[FULL*m+j]<dp[FULL*m+end])end=j;
  const seq=[];let S=FULL,j=end;while(j>=0){seq.push(j);const pj=par[S*m+j];S&=~(1<<j);j=pj;}
  return [order[0]].concat(seq.reverse().map(j=>order[j+1]));
}

  if(st.near!==p.i&&pane!=='course')links.push('<a href="#" onclick="window.__near('+p.i+');return false;">근처 보기</a>');
  links.push('<a href="'+link(p)+'" target="_blank" rel="noopener">카카오맵 ↗</a>');
  iw.setContent('<div class="iw"><strong>'+esc(p.n)+'</strong>'+(p.memo?'<span>'+esc(p.memo)+'</span><br>':'')+'<span>'+esc(CAT_NAME[p.k]+(p.kl?' · '+p.kl:'')+' · '+p.sd+' '+p.sg+' '+p.dg)+'</span><br>'+links.join(' · ')+'</div>');
  iw.open(map,m);
}
function fit(ms){
  if(!ms.length)return;
  if(ms.length===1){map.setLevel(4);map.setCenter(ms[0].getPosition());return;}
  const b=new kakao.maps.LatLngBounds();ms.forEach(m=>b.extend(m.getPosition()));map.setBounds(b);
}
function updateMap(){
  if(!mapReady)return;
  iw.close();clusterer.clear();circle.setMap(null);line.setMap(null);
  nums.forEach(o=>o.setMap(null));nums=[];
  markers.forEach((m,i)=>{if(m){m.setMap(null);m.setImage(imgs[places[i].k]);m.setZIndex(0);}});
  map.relayout();
  const ms=current.map(p=>markers[p.i]).filter(Boolean);
  if(pane==='course'){
    ms.forEach(m=>m.setMap(map));
    current.forEach((p,j)=>{
      const el=document.createElement('div');el.className='ovnum';el.style.background=PIN[p.k];el.textContent=j+1;
      nums.push(new kakao.maps.CustomOverlay({position:markers[p.i].getPosition(),content:el,yAnchor:2.1,zIndex:6,map}));
    });
    if(ms.length>1){line.setPath(ms.map(m=>m.getPosition()));line.setMap(map);}
    fit(ms);return;
  }
  if(st.near!=null){
    const c=places[st.near],cm=markers[st.near];
    ms.forEach(m=>m.setMap(map));
    cm.setImage(bigImgs[c.k]);cm.setZIndex(5);
    circle.setOptions({center:cm.getPosition(),radius:st.r});circle.setMap(map);
    map.setBounds(circle.getBounds());
    return;
  }
  clusterer.addMarkers(ms);
  fit(ms);
}

/* ---- tabs ---- */
function applyTabs(){
  const showMap=wide.matches||mapOpen;
  $('#tabList').setAttribute('aria-selected',pane==='list'&&!(mapOpen&&!wide.matches));
  $('#tabCourse').setAttribute('aria-selected',pane==='course'&&!(mapOpen&&!wide.matches));
  $('#tabMap').setAttribute('aria-selected',mapOpen&&!wide.matches);
  $('#listPane').hidden=!wide.matches&&mapOpen;
  $('#mapPane').hidden=!showMap;
  if(showMap){loadSdk();if(mapReady){map.relayout();updateMap();}}
}
function setPane(p){
  const changed=pane!==p;pane=p;mapOpen=false;courseMsg='';clearArmed=false;
  if(changed)all();
  applyTabs();window.scrollTo(0,0);
}
$('#tabList').addEventListener('click',()=>setPane('list'));
$('#tabCourse').addEventListener('click',()=>setPane('course'));
$('#tabMap').addEventListener('click',()=>{mapOpen=true;applyTabs();window.scrollTo(0,0);});
wide.addEventListener('change',()=>{if(wide.matches)mapOpen=false;applyTabs();});

$('#cat').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;st.k=b.dataset.k;all();});
$('#sido').addEventListener('click',e=>{const b=e.target.closest('[data-sd]');if(!b)return;st.sd=b.dataset.sd;st.sg='';all();});
$('#sgg').addEventListener('click',e=>{const b=e.target.closest('[data-sg]');if(!b)return;st.sg=b.dataset.sg;renderSgg();renderKind();renderList();save();});
$('#kind').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;st.g=b.dataset.g;renderKind();renderList();save();});
let t;$('#q').addEventListener('input',e=>{st.q=e.target.value;$('#clear').hidden=!st.q;clearTimeout(t);t=setTimeout(renderList,150);});
$('#clear').addEventListener('click',()=>{st.q='';$('#q').value='';$('#clear').hidden=true;renderList();$('#q').focus();});
$('#out').addEventListener('click',e=>{
  const ab=e.target.closest('[data-add]');if(ab){toggleCourse(+ab.dataset.add);return;}
  const nb=e.target.closest('[data-near]');if(nb){openNear(+nb.dataset.near);return;}
  if(e.target.closest('#nearClose')){closeNear();return;}
  const rb=e.target.closest('[data-r]');if(rb){st.r=+rb.dataset.r;renderCat();renderList();save();return;}
  if(e.target.closest('#optBtn')){
    const before=courseLen(course),next=bestOrder(course),after=courseLen(next);
    const same=next.every((v,j)=>v===course[j]);
    course=next;saveCourse();
    courseMsg=same?'이미 가장 짧은 순서예요.':'직선거리 합계가 '+fmtM(before)+'에서 '+fmtM(after)+'로 줄었어요.';
    clearArmed=false;renderCourse();return;
  }
  if(e.target.closest('#clearBtn')){
    if(!clearArmed){clearArmed=true;renderCourse();return;}
    course=[];clearArmed=false;courseMsg='';saveCourse();refreshCourseBits();return;
  }
  const sb=e.target.closest('[data-start]');if(sb){const i=+sb.dataset.start;course=[i].concat(course.filter(x=>x!==i));courseMsg='';saveCourse();renderCourse();return;}
  const db=e.target.closest('[data-del]');if(db){toggleCourse(+db.dataset.del);return;}
  const b=e.target.closest('.pin');if(!b)return;
  const p=places[+b.dataset.i];
  mapOpen=true;applyTabs();if(!wide.matches)window.scrollTo(0,0);
  const go=()=>{map.relayout();map.setLevel(3);map.setCenter(markers[p.i].getPosition());openInfo(p,markers[p.i]);};
  if(mapReady)go();else{const w=setInterval(()=>{if(mapReady){clearInterval(w);go();}},200);setTimeout(()=>clearInterval(w),10000);}
});
all();applyTabs();
</script>
</body>
